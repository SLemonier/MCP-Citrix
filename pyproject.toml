[project]
name = "mcp-citrix"
version = "0.1.0"
description = "MCP server for Citrix Virtual Apps & Desktops (CVAD) and Citrix DaaS infrastructure management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25,<2",
    "httpx>=0.28",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-citrix = "mcp_citrix.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_citrix"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
]
